name: CI

# POR QUE EXISTE ESTE FICHERO (2026-09-14)
#
# Este repositorio va de una sola idea: que un verde signifique algo. Publicarlo sin nada que
# corra los tests seria la contradiccion mas barata posible — un repo sobre verificacion cuya
# unica prueba es la palabra de quien lo escribio.
#
# Y trae ademas una razon propia: estas cuatro herramientas se extrajeron de otro repositorio, y
# la extraccion es justo el momento en que algo deja de funcionar sin que nadie se entere. En un
# runner el usuario NO se llama como el de desarrollo, asi que cualquier ruta de casa cableada
# revienta al instante en vez de esperar a que alguien la vea.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: pytest (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 es el suelo que se quiere soportar; 3.14 es donde se desarrolla. Sin la de abajo,
        # "funciona en cualquier Python moderno" seria una afirmacion sin comprobar; sin la de
        # arriba, el CI podria estar verde mientras el entorno real falla.
        python: ["3.10", "3.12", "3.14"]
        os: [ubuntu-latest]
        # Windows va aparte y con una sola version: el eje `python` prueba compatibilidad de
        # lenguaje, el sistema operativo prueba otra cosa. Y aqui prueba algo concreto: dos de
        # estas herramientas lanzan subprocesos, y en la maquina donde se empaquetaron fallaban
        # de forma intermitente con `OSError: [WinError 6]`. Este trabajo contesta si eso era de
        # aquella maquina o de Windows.
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Sin `pip install` de dependencias A PROPOSITO: estas herramientas no tienen ninguna fuera
      # de la libreria estandar, y este paso lo demuestra en vez de prometerlo. Si alguna vez
      # aparece un import de fuera, este trabajo se pone rojo, que es lo que se quiere.
      - run: pip install pytest
      - run: python -m pytest -q
